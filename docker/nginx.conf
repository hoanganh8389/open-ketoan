# [2026-11-22 11:30 AM Johnny Chu - Chu Hoàng Anh] PHASE-038 — B2 (S038-6): api không trả lời → JSON GATEWAY_UNAVAILABLE (không còn trang HTML 502); logs/web-loi.log; phân giải tên api lúc chạy

# Nhật ký lỗi cố định của cổng vào (PHASE-038, R-LOG-9): nginx ghi <thư mục cài>/logs/web/dang-ghi.log (mount /var/log/ketoan);
# docker/web-xoay-log.sh mỗi phút chuyển sang logs/web/<YYYY-MM-DD>.log, giữ 30 ngày, 10 MB / tệp, thư mục 30 MB (B6, D038-7). Chỉ dòng truy cập có mã ≥ 500 + error_log mức warn. Ghi $uri, KHÔNG $request_uri:
# chuỗi truy vấn có thể chứa dữ liệu người dùng (R-LOG-4). rid = $request_id = requestId trong thân JSON GATEWAY_UNAVAILABLE.
map $status $ketoan_loi5xx {
  ~^5     1;
  default 0;
}
log_format ketoan_loi '$time_iso8601 $status $request_method $uri rid=$request_id upstream=$upstream_addr ustatus=$upstream_status rt=$request_time urt=$upstream_response_time';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # stdout / stderr (docker compose logs) giữ như cũ; thêm tệp lỗi cố định.
  access_log /var/log/nginx/access.log main;
  access_log /var/log/ketoan/web/dang-ghi.log ketoan_loi if=$ketoan_loi5xx;
  error_log /var/log/nginx/error.log warn;
  error_log /var/log/ketoan/web/dang-ghi.log warn;

  # Tên "api" phân giải LÚC CHẠY qua DNS của Docker (proxy_pass bằng biến), không chỉ một lần khi nginx khởi động:
  #   - api dựng lại / đổi IP → nginx không gọi IP cũ;
  #   - web khởi động lúc api chưa có → nginx vẫn chạy, trả GATEWAY_UNAVAILABLE thay vì không lên.
  # proxy_pass bằng biến, không phần URI → nginx chuyển nguyên URI gốc như trước.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  set $ketoan_api http://api:4100;

  # api không trả lời (từ chối kết nối, không phân giải được tên — api dừng / đang khởi động lại) → nginx tự sinh 502 / 503
  # → JSON có mã. KHÔNG chặn 504: quá proxy_read_timeout thường là báo cáo chạy lâu khi api vẫn sống — giao diện đã có câu riêng
  # cho 504 ("thu hẹp chi nhánh / kho / kỳ"), gộp vào "không kết nối được" sẽ chỉ sai hướng.
  # KHÔNG proxy_intercept_errors: 5xx do chính api trả (NOT_READY, INTERNAL_ERROR có requestId) đi nguyên tới bên gọi.
  location @gateway_unavailable {
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
    return 503 '{"ok":false,"error":{"code":"GATEWAY_UNAVAILABLE","message":"Không kết nối được máy chủ phần mềm","requestId":"$request_id"}}';
  }

  # Header bảo mật (R-SEC-11). LƯU Ý nginx: location nào có add_header riêng thì KHÔNG thừa hưởng add_header của server
  # → lặp lại cùng bốn dòng trong từng location có add_header bên dưới.
  # Không đặt X-Frame-Options / frame-ancestors: phần mềm được nhúng trong khung trang quản trị WordPress.
  # HSTS đặt ở proxy TLS phía trước (cổng 443), không đặt ở đây (cổng 80 nội bộ) — xem docs/ops/DEPLOY.md.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;

  # API và tài liệu API → container api
  location /api/ {
    proxy_pass $ketoan_api;
    error_page 502 503 = @gateway_unavailable;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # [2026-11-23 01:10 AM Johnny Chu - Chu Hoàng Anh] PHASE-039 — B8b: Provisioning API (/_sites/v1, chế độ multi, chỉ tên miền SITE_ADMIN_HOST) → container api.
  # Thiếu khối này thì /_sites/… rơi vào location / (trả index.html của SPA) — gặp thật khi dựng openketoan.com trên VPS 2026-11-23.
  location /_sites/ {
    proxy_pass $ketoan_api;
    error_page 502 503 = @gateway_unavailable;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Tệp tĩnh có mã băm: lưu đệm lâu
  # MCP cho trợ lý AI (bizcity_mcp@1): POST /mcp → container api. Thời hạn ngắn theo bridge §3 (ghi ≤ 8 giây, có dư).
  location = /mcp {
    proxy_pass $ketoan_api;
    error_page 502 503 = @gateway_unavailable;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
  }

  # Ứng dụng một trang: mọi đường dẫn khác trả index.html.
  # index.html KHÔNG lưu đệm (luôn hỏi lại máy chủ): bản mới triển khai là trình duyệt (kể cả khung nhúng trong trang
  # quản trị) nạp ngay, không kẹt bản cũ. Tệp /assets/ có mã băm nên vẫn lưu đệm lâu.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
  }
}
